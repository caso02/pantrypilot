services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pantrypilot
      POSTGRES_PASSWORD: pantrypilot
      POSTGRES_DB: pantrypilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pantrypilot"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://pantrypilot:pantrypilot@postgres:5432/pantrypilot?schema=public
      REDIS_URL: redis://redis:6379
      PORT: "3000"
      MIGROS_REGION: national
      MIGROS_LANGUAGE: de
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
