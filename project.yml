name: PantryPilot
options:
  bundleIdPrefix: com.lucashersche
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: 1
    # Nach Google Cloud Console Setup hier eintragen:
    GOOGLE_CLIENT_ID: "206953027395-klenrvrmjlr1mi7f435v88oh9e5l02lt.apps.googleusercontent.com"
    GOOGLE_REVERSED_CLIENT_ID: "com.googleusercontent.apps.206953027395-klenrvrmjlr1mi7f435v88oh9e5l02lt"

targets:
  PantryPilot:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PantryPilot
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
    info:
      path: PantryPilot/Info.plist
      properties:
        NSCameraUsageDescription: "PantryPilot benötigt Kamerazugriff, um Kassenzettel zu scannen."
        NSLocalNetworkUsageDescription: "PantryPilot verbindet sich mit dem lokalen Backend-Server."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        GIDClientID: $(GOOGLE_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucashersche.pantrypilot
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: true
        SWIFT_EMIT_LOC_STRINGS: true
    entitlements:
      path: PantryPilot/PantryPilot.entitlements

  PantryPilotTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PantryPilotTests
    dependencies:
      - target: PantryPilot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucashersche.pantrypilot.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PantryPilot.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/PantryPilot"
        BUNDLE_LOADER: "$(TEST_HOST)"
