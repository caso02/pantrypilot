name: PantryPilot
options:
  bundleIdPrefix: com.pantrypilot
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: 1
    INFOPLIST_KEY_NSCameraUsageDescription: "PantryPilot benötigt Kamerazugriff, um Kassenzettel zu scannen."
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true

targets:
  PantryPilot:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PantryPilot
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pantrypilot.app
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_NSCameraUsageDescription: "PantryPilot benötigt Kamerazugriff, um Kassenzettel zu scannen."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: true
        SWIFT_EMIT_LOC_STRINGS: true
    entitlements:
      path: PantryPilot/PantryPilot.entitlements
      properties:
        aps-environment: development

  PantryPilotTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PantryPilotTests
    dependencies:
      - target: PantryPilot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pantrypilot.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PantryPilot.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/PantryPilot"
        BUNDLE_LOADER: "$(TEST_HOST)"
